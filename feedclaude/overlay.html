<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; cursor: none; }
  html, body { overflow: hidden; background: transparent; width: 100%; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ABOUTME: Food toss overlay — a persistent taco/burrito follows your cursor
// ABOUTME: Wave fast to feed Claude with crunching sounds and flying food

const P = {
  foodSize:        52,      // emoji font size
  bobAmplitude:    6,       // gentle bob
  bobSpeed:        0.005,   // bob frequency
  trailRate:       0.2,     // particle trail rate
  tossThreshold:   10,      // mouse speed to trigger feeding (low = easy)
  tossCooldownMs:  1200,    // min ms between feeds
  firstTossGraceMs: 300,    // grace period after spawn
  bgAlpha:         0.015,   // barely-visible bg for mouse capture
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let mouseX = W / 2, mouseY = H / 2;
let prevMouseX = 0, prevMouseY = 0;
let active = false;
let spawnTime = 0;
let lastTossTime = 0;
let smoothSpeed = 0;
let feedCount = 0;

const FOODS = ['🌮', '🌯'];
let currentFood = FOODS[0];

document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// ESC key to dismiss — no accidental click dismissal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && active) {
    active = false;
    window.bridge.hideOverlay();
  }
});

// Click does NOT dismiss — just spawns a little burst for fun
document.addEventListener('mousedown', () => {
  if (active) {
    for (let i = 0; i < 8; i++) spawnParticle(mouseX, mouseY, false);
  }
});

// ── Food-colored particles ────────────────────────────────────────────────
let particles = [];
const MAX_PARTICLES = 400;
const FOOD_HUES = [0, 10, 25, 40, 55, 100, 120]; // red → orange → yellow → green

function spawnParticle(x, y, burst) {
  if (particles.length >= MAX_PARTICLES) return;
  const speed = burst ? (Math.random() * 7 + 3) : (Math.random() * 1.5 + 0.3);
  const angle = Math.random() * Math.PI * 2;
  const hue = FOOD_HUES[Math.floor(Math.random() * FOOD_HUES.length)];
  particles.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed - (burst ? 3.5 : 0.6),
    life: 1.0,
    decay: burst ? (0.006 + Math.random() * 0.012) : (0.012 + Math.random() * 0.025),
    size: burst ? (Math.random() * 7 + 3) : (Math.random() * 4 + 1),
    hue,
    shape: burst ? (Math.random() < 0.5 ? 'star' : 'circle') : 'circle',
  });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03;
    p.vx *= 0.98;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawStarShape(cx, cy, r, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = (i * Math.PI) / points - Math.PI / 2;
    const radius = i % 2 === 0 ? r : r * 0.3;
    const x = cx + Math.cos(a) * radius;
    const y = cy + Math.sin(a) * radius;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life * p.life;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `hsl(${p.hue}, 90%, ${50 + p.life * 20}%)`;
    ctx.shadowColor = `hsl(${p.hue}, 100%, 70%)`;
    ctx.shadowBlur = 10 * p.life;
    if (p.shape === 'star') {
      drawStarShape(p.x, p.y, p.size * (0.5 + p.life * 0.5), 5);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ── Flying food items ─────────────────────────────────────────────────────
let tossedFoods = [];

function tossFood(x, y) {
  const emoji = FOODS[Math.floor(Math.random() * FOODS.length)];
  // Toss upward and outward in random direction
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
  const speed = 6 + Math.random() * 8;
  tossedFoods.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    emoji,
    life: 1.0,
    spin: (Math.random() - 0.5) * 0.4,
    rotation: 0,
    size: 30 + Math.random() * 24,
  });
}

function updateTossedFoods() {
  for (let i = tossedFoods.length - 1; i >= 0; i--) {
    const f = tossedFoods[i];
    f.x += f.vx;
    f.y += f.vy;
    f.vy += 0.12;
    f.rotation += f.spin;
    f.life -= 0.006;
    if (Math.random() < 0.25 && f.life > 0.2) spawnParticle(f.x, f.y, false);
    if (f.life <= 0 || f.y > H + 100) tossedFoods.splice(i, 1);
  }
}

function drawTossedFoods() {
  for (const f of tossedFoods) {
    ctx.save();
    ctx.globalAlpha = Math.min(f.life * 2, 1);
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rotation);
    ctx.font = `${f.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.emoji, 0, 0);
    ctx.restore();
  }
}

// ── CRUNCH SOUND — loud and satisfying ────────────────────────────────────
function playCrunchSound() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const now = ac.currentTime;
    const vol = 0.5; // LOUD

    // === Crunch 1: big bite ===
    const crunchBuf = ac.createBuffer(1, ac.sampleRate * 0.15, ac.sampleRate);
    const crunchData = crunchBuf.getChannelData(0);
    for (let i = 0; i < crunchData.length; i++) {
      const t = i / crunchData.length;
      crunchData[i] = (Math.random() * 2 - 1) * (1 - t) * 0.8;
    }
    const crunch1 = ac.createBufferSource();
    crunch1.buffer = crunchBuf;
    const crunchGain = ac.createGain();
    crunchGain.gain.setValueAtTime(vol * 0.6, now);
    crunchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    const crunchFilter = ac.createBiquadFilter();
    crunchFilter.type = 'bandpass';
    crunchFilter.frequency.value = 2500;
    crunchFilter.Q.value = 1.5;
    crunch1.connect(crunchFilter);
    crunchFilter.connect(crunchGain);
    crunchGain.connect(ac.destination);
    crunch1.start(now);

    // === Crunch 2: second bite ===
    const crunch2 = ac.createBufferSource();
    crunch2.buffer = crunchBuf;
    const crunchGain2 = ac.createGain();
    crunchGain2.gain.setValueAtTime(vol * 0.4, now + 0.1);
    crunchGain2.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    const crunchFilter2 = ac.createBiquadFilter();
    crunchFilter2.type = 'bandpass';
    crunchFilter2.frequency.value = 3500;
    crunchFilter2.Q.value = 1.2;
    crunch2.connect(crunchFilter2);
    crunchFilter2.connect(crunchGain2);
    crunchGain2.connect(ac.destination);
    crunch2.start(now + 0.1);

    // === Low satisfying thump (the bite) ===
    const thump = ac.createOscillator();
    const thumpGain = ac.createGain();
    thump.type = 'sine';
    thump.frequency.setValueAtTime(150, now);
    thump.frequency.exponentialRampToValueAtTime(50, now + 0.2);
    thumpGain.gain.setValueAtTime(vol * 0.5, now);
    thumpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    thump.connect(thumpGain);
    thumpGain.connect(ac.destination);
    thump.start(now);
    thump.stop(now + 0.3);

    // === Happy "nom nom" rising tone ===
    const nom = ac.createOscillator();
    const nomGain = ac.createGain();
    nom.type = 'triangle';
    nom.frequency.setValueAtTime(300, now + 0.15);
    nom.frequency.exponentialRampToValueAtTime(600, now + 0.3);
    nom.frequency.exponentialRampToValueAtTime(900, now + 0.45);
    nomGain.gain.setValueAtTime(vol * 0.25, now + 0.15);
    nomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    nom.connect(nomGain);
    nomGain.connect(ac.destination);
    nom.start(now + 0.15);
    nom.stop(now + 0.55);

  } catch (e) {}
}

// ── Floating "fed!" text ──────────────────────────────────────────────────
let floatingTexts = [];

function spawnFloatingText(x, y) {
  feedCount++;
  const msgs = ['NOM!', 'CRUNCH!', 'YUM!', 'DELICIOUS!', 'FED! 🌮', 'TASTY! 🌯', 'MUNCH!'];
  floatingTexts.push({
    x: x + (Math.random() - 0.5) * 60,
    y: y - 30,
    text: msgs[Math.floor(Math.random() * msgs.length)],
    life: 1.0,
    vy: -2,
  });
}

function updateFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy;
    t.vy *= 0.98;
    t.life -= 0.015;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  for (const t of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = t.life;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = `hsl(${30 + Math.random() * 20}, 100%, 70%)`;
    ctx.shadowColor = 'rgba(255, 150, 0, 0.8)';
    ctx.shadowBlur = 12;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
}

// ── Update ─────────────────────────────────────────────────────────────────
function update() {
  updateParticles();
  updateTossedFoods();
  updateFloatingTexts();
  if (!active) return;

  const mvx = mouseX - prevMouseX;
  const mvy = mouseY - prevMouseY;
  const speed = Math.hypot(mvx, mvy);

  // Trail particles when moving
  if (speed > 2 && Math.random() < P.trailRate) {
    spawnParticle(mouseX, mouseY, false);
  }
  if (speed > 6 && Math.random() < P.trailRate * 2) {
    spawnParticle(mouseX, mouseY, false);
  }

  // Feed detection: fast movement
  smoothSpeed = smoothSpeed * 0.7 + speed * 0.3;
  const now = Date.now();
  if (smoothSpeed > P.tossThreshold &&
      now - spawnTime >= P.firstTossGraceMs &&
      now - lastTossTime > P.tossCooldownMs) {
    lastTossTime = now;
    playCrunchSound();
    // Big burst of particles
    for (let i = 0; i < 35; i++) spawnParticle(mouseX, mouseY, true);
    // Toss 4 food items
    for (let i = 0; i < 4; i++) tossFood(mouseX, mouseY);
    // Floating text
    spawnFloatingText(mouseX, mouseY);
    // Send the message to Claude
    window.bridge.sendFood();
  }

  prevMouseX = mouseX;
  prevMouseY = mouseY;
}

// ── Rendering ──────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = `rgba(0,0,0,${P.bgAlpha})`;
  ctx.fillRect(0, 0, W, H);

  drawParticles();
  drawTossedFoods();
  drawFloatingTexts();

  if (!active) return;

  // Draw the food emoji following the cursor with a gentle bob
  const bob = Math.sin(Date.now() * P.bobSpeed) * P.bobAmplitude;
  const foodX = mouseX;
  const foodY = mouseY + bob;

  // Warm glow behind the food
  ctx.save();
  const gradient = ctx.createRadialGradient(foodX, foodY, 5, foodX, foodY, 60);
  gradient.addColorStop(0, 'rgba(255, 165, 0, 0.3)');
  gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.15)');
  gradient.addColorStop(1, 'rgba(255, 69, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(foodX, foodY, 60, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // The food emoji itself
  ctx.save();
  ctx.font = `${P.foodSize}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(255, 150, 0, 0.5)';
  ctx.shadowBlur = 15;
  ctx.fillText(currentFood, foodX, foodY);
  ctx.restore();

  // Feed counter
  if (feedCount > 0) {
    ctx.save();
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fillText(`Fed Claude ${feedCount} time${feedCount !== 1 ? 's' : ''}!`, foodX, foodY + 40);
    ctx.restore();
  }

  // Instructions (subtle, at bottom)
  ctx.save();
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fillText('wave fast to feed  •  press ESC to close', W / 2, H - 30);
  ctx.restore();
}

// ── Main loop ──────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ── IPC from main process ──────────────────────────────────────────────────
window.bridge.onSpawnFood(() => {
  active = true;
  smoothSpeed = 0;
  spawnTime = Date.now();
  lastTossTime = 0;
  feedCount = 0;
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  currentFood = FOODS[Math.floor(Math.random() * FOODS.length)];
});

window.bridge.onDropFood(() => {
  active = false;
  window.bridge.hideOverlay();
});

</script>
</body>
</html>
