app = "morning-ledger"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  LEDGER_DB_PATH = "/data/ledger.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "ledger_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
